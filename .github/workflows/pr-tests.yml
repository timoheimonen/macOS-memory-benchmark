name: Tests

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-all:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install GoogleTest
        run: brew install googletest

      - name: Run all tests
        run: make test-all
